name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Application
        shell: cmd
        run: |
          mkdir dist
          cl /nologo /utf-8 /EHsc /O2 /std:c++17 /DUNICODE /D_UNICODE MouseRipple.cpp /link /SUBSYSTEM:WINDOWS gdiplus.lib user32.lib gdi32.lib shell32.lib comctl32.lib comdlg32.lib advapi32.lib /OUT:dist\mouse_light.exe
          copy MouseRipple.ini dist\MouseRipple.ini
          copy README.md dist\README.md
          copy LICENSE dist\LICENSE
          cd dist
          tar -a -c -f mouse_light-windows-x64.zip mouse_light.exe MouseRipple.ini README.md LICENSE
          cd ..

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/mouse_light.exe
            dist/mouse_light-windows-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mouse_light.exe
            dist/mouse_light-windows-x64.zip
          generate_release_notes: true
